# Use a unique project name. No persistent volume and no existing database access.
services:
  mysql:
    image: mysql:8.4.6@sha256:869218921e61d6c3c89820955d63cca42971f0e3e6c1e2792247bbd944ebc6e9
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_TEST_PASSWORD:?Set a disposable test password}
      MYSQL_ROOT_HOST: "%"
    ports:
      - "127.0.0.1:${MYSQL_TEST_PORT:-3308}:3306"
    tmpfs:
      - /var/lib/mysql
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_bin", "--default-time-zone=+00:00"]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysql -h 127.0.0.1 -u root -e 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
