name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  foundation-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/verify-foundation.sh

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements-dev.txt
            backend/requirements.txt
            backend/constraints.txt
      - run: python -m pip install --requirement backend/requirements-dev.txt
      - name: Prepare verified PDF template font
        run: |
          python -m scripts.prepare_report_font --output "$RUNNER_TEMP/ayursage-font/DejaVuSans.ttf"
          echo "REPORT_FONT_PATH=$RUNNER_TEMP/ayursage-font/DejaVuSans.ttf" >> "$GITHUB_ENV"
      - run: python -m pytest tests/backend

  mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements-dev.txt
            backend/requirements.txt
            backend/constraints.txt
      - run: python -m pip install --requirement backend/requirements-dev.txt
      - name: Prepare verified PDF template font
        run: |
          python -m scripts.prepare_report_font --output "$RUNNER_TEMP/ayursage-font/DejaVuSans.ttf"
          echo "REPORT_FONT_PATH=$RUNNER_TEMP/ayursage-font/DejaVuSans.ttf" >> "$GITHUB_ENV"
      - run: python -m scripts.test_mysql

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
        working-directory: frontend
      - run: npm run check
        working-directory: frontend

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install --requirement backend/requirements-dev.txt
      - name: Prepare verified PDF template font
        run: |
          python -m scripts.prepare_report_font --output "$RUNNER_TEMP/ayursage-font/DejaVuSans.ttf"
          echo "REPORT_FONT_PATH=$RUNNER_TEMP/ayursage-font/DejaVuSans.ttf" >> "$GITHUB_ENV"
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend

  release-preparation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -f deployment/Dockerfile -t ayursage:ci .
      - name: Check non-root image and verified font
        run: |
          docker run --rm --entrypoint sh ayursage:ci -c 'test "$(id -u)" != 0 && test "$(sha256sum /app/report-font/DejaVuSans.ttf | cut -d " " -f 1)" = 57f73e11f51999432bf7ab22ce55b6f945d5eca1bf824404cfa9ec2e3718c84e && gunicorn --version'
      - name: Compile Azure templates (no deployment)
        run: |
          curl -fsSLo bicep https://github.com/Azure/bicep/releases/download/v0.48.1/bicep-linux-x64
          chmod +x bicep
          for template in deployment/azure/*.bicep; do ./bicep build "$template" --stdout >/dev/null; done
      - name: Python release scripts syntax
        run: python -m py_compile scripts/database_backup.py
