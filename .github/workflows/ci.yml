name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  foundation-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/verify-foundation.sh

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements-dev.txt
            backend/requirements.txt
            backend/constraints.txt
      - run: python -m pip install --requirement backend/requirements-dev.txt
      - name: Prepare verified PDF template font
        run: |
          python -m scripts.prepare_report_font --output "$RUNNER_TEMP/ayursage-font/DejaVuSans.ttf"
          echo "REPORT_FONT_PATH=$RUNNER_TEMP/ayursage-font/DejaVuSans.ttf" >> "$GITHUB_ENV"
      - run: python -m pytest tests/backend

  mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements-dev.txt
            backend/requirements.txt
            backend/constraints.txt
      - run: python -m pip install --requirement backend/requirements-dev.txt
      - name: Prepare verified PDF template font
        run: |
          python -m scripts.prepare_report_font --output "$RUNNER_TEMP/ayursage-font/DejaVuSans.ttf"
          echo "REPORT_FONT_PATH=$RUNNER_TEMP/ayursage-font/DejaVuSans.ttf" >> "$GITHUB_ENV"
      - run: python -m scripts.test_mysql

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
        working-directory: frontend
      - run: npm run check
        working-directory: frontend
